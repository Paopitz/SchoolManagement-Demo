<div class="shell">
  <aside class="sidebar">
    <div class="brand">SMS DEMO</div>
    <nav aria-label="Primary">
      <ul>
        @for (item of visibleNavItems(); track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="user-info">
        @if (currentUser(); as user) {
          {{ user.username }} · {{ user.roles.join(', ') }}
        }
      </span>
      <button type="button" (click)="logout()">Sign out</button>
    </header>

    <main class="content">
      <p role="note">DEMO ONLY - Fictional sample data. No API or database. Reload the page to reset demo changes.</p>
      <router-outlet />
    </main>
  </div>
</div>
